name: Publish Nutri iPhone beta
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release:
        description: Published beta release tag
        required: true
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download only the public application artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release }}
        run: |
          mkdir -p package site
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'nutri-pwa.zip' --pattern 'SHA256SUMS' --dir package
          (cd package && sha256sum --check SHA256SUMS)
          unzip -q package/nutri-pwa.zip -d site
          test -f site/index.html
          test -f site/sw.js
          test -f site/manifest.webmanifest
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify Nutribot from a runner outside the private network
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --max-time 20 'https://homeassistant.taild3970f.ts.net:8443/health' | python -c 'import json,sys; value=json.load(sys.stdin); assert value["status"]=="ok" and value["configured"] is True'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 20 -X POST -H 'Content-Type: application/json' --data '{}' 'https://homeassistant.taild3970f.ts.net:8443/chat')" = 401
